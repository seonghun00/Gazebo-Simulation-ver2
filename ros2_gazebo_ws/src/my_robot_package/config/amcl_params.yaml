# 저장된 식당 지도에서 로봇 위치를 추정하기 위한 AMCL 설정 파일.
#
# localization.launch.py가 이 파일을 AMCL에 전달한다. AMCL은 /scan, 바퀴
# 오도메트리, /map을 비교해 로봇 위치를 추정하고 map -> odom TF를 발행한다.
# 시뮬레이션 로봇은 아래 충전소 좌표에서 고정적으로 생성되므로 일반적으로
# RViz의 2D Pose Estimate를 다시 지정하지 않아도 된다.

amcl:
  ros__parameters:
    use_sim_time: true

    # 위치 추정에 사용할 기준 프레임과 센서 토픽 이름.
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan

    # 좌우 바퀴로 움직이는 차동구동 로봇의 오도메트리 모델.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # 일부 LaserScan 광선을 점유 지도와 비교하는 센서 모델 설정.
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2

    # 파티클 필터 개수와 위치 추정을 갱신할 이동·회전 기준.
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.20
    update_min_a: 0.20
    resample_interval: 1
    transform_tolerance: 1.0

    # Gazebo 스폰 좌표와 동일한 충전소 위치를 AMCL 초기 위치로 사용한다.
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: -7.12
      y: -4.988542
      z: 0.0
      yaw: 0.0
