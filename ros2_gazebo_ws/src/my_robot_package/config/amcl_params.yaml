amcl:
  ros__parameters:
    use_sim_time: true

    # Frame and topic names used by this robot.
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan

    # Differential-drive odometry motion model.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Compare a reduced set of laser beams with the occupancy grid.
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2

    # Particle-filter size and update thresholds.
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.20
    update_min_a: 0.20
    resample_interval: 1
    transform_tolerance: 1.0

    # The simulation always spawns the robot at the charging station.
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: -7.12
      y: -4.988542
      z: 0.0
      yaw: 0.0
