# ============================================================
# docker-compose.yml
# Purpose:
#    Windows 10 + Docker Desktop 환경에서
#    로컬 폴더 전체를 컨테이너 홈(/root)에 직접 연동 (workspace 포함)
# ============================================================

services:
  robot-sim:
    build:
      context: .
      dockerfile: Dockerfile

    image: robot-sim-bridge:humble-mujoco-3.6.0
    container_name: robot-sim-bridge

    stdin_open: true
    tty: true
    network_mode: bridge

    environment:
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
      - ROS_DOMAIN_ID=30

# --------------------------------------------------------
# [완벽 연동] 내 컴퓨터 현재 폴더 전체를 /root에 매핑하여 
# ros2_gazebo_ws와 workspace 폴더를 모두 루트에서 다이렉트 연동함
# --------------------------------------------------------
    # 내 컴퓨터의 ./ros2_gazebo_ws 폴더를 컨테이너의 /workspace/ros2_gazebo_ws 에만 연결
    volumes:
      - ./ros2_gazebo_ws:/workspace/ros2_gazebo_ws
    
    # 터미널 접속 시 시작 위치 지정
    working_dir: /workspace/ros2_gazebo_ws
    # Compose 시작 시 지속되는 tmux 세션을 미리 생성합니다.
    # 접속: docker compose exec robot-sim tmux attach -t robot-sim
    command:
      - /bin/bash
      - -lc
      - |
        if ! command -v tmux >/dev/null 2>&1; then
          apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list -o Dir::Etc::sourceparts=-
          apt-get install -y --no-install-recommends tmux
          rm -rf /var/lib/apt/lists/*
        fi
        tmux has-session -t robot-sim 2>/dev/null || tmux new-session -d -s robot-sim -c /workspace/ros2_gazebo_ws
        exec sleep infinity
